# Runs the regression tests and the formatting check for every pull request and every push to main.
# The tests use only Node built-ins; npm ci installs the pinned formatter from package-lock.json.
name: test

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit; update the SHA and the version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run format:check
