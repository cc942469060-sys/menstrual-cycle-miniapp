# Runs the regression tests and the formatting check for every pull request and every push to main.
# The tests use only Node built-ins; npm ci installs the pinned formatter from package-lock.json.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run format:check
